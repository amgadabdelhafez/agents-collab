name: CI

on:
  push:
  pull_request:

jobs:
  loop-fork:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: loop-fork
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run tests
        run: bun run test:ci

      - name: Build CLI
        run: bun run build
