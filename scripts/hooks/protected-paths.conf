# Protected configuration paths for scripts/hooks/guard-protected-paths.py
#
# One glob per line. `#` starts a comment.
#   * a line starting with `/` or `~` is an ABSOLUTE path (outside the repo)
#   * anything else is a glob relative to the repo root of THIS checkout,
#     so it applies identically in every worktree
#
# Only WRITES are denied. Reads are always allowed.
# Removing a line here is itself a protected edit -- do it on a reviewed
# branch, not mid-task.

# --- the guard's own machinery (no self-disarming) ---
.claude/settings.json
.claude/settings.local.json
scripts/hooks/**

# --- ignore rules: local checkouts/worktrees stay untracked ---
.gitignore

# --- user-level agent configuration, hardened by the founder 2026-07-27 ---
# Already on the permissions deny list; repeated here so the block also fires
# for Bash writes and for agents running with different permission settings.
~/.claude/settings.json
~/.claude/settings.local.json
~/.claude/CLAUDE.md
~/.codex/config.toml
~/.codex/AGENTS.md

# NOT protected on purpose:
#   specs/constitution.md   -- still carries the "(Fill in your actual invariants)"
#                              placeholder; it needs editing, not freezing.
#   loop-fork/**            -- vendored source under active development.
#   .github/                -- this repo has no workflows; add
#                              `.github/workflows/**` here if that changes.
